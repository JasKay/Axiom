name: Desktop feature validation
on:
  push:
    branches: [desktop-qa]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  features:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm ci --prefix desktop
      - name: Package Windows application for an early asset check
        if: runner.os == 'Windows'
        run: npm run package --prefix desktop -- --win --x64 --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify Windows packaged fonts and source
        if: runner.os == 'Windows'
        run: node desktop/verify-package.cjs
      - name: Package Windows installer
        id: windows-package
        if: runner.os == 'Windows'
        run: npm run package --prefix desktop -- --win --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Package Mac app
        if: runner.os == 'macOS'
        run: npm run package --prefix desktop -- --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node desktop/verify-package.cjs
      - run: node desktop/smoke.cjs
      - run: node desktop/features.cjs
      - run: node desktop/desk-scrolling.cjs
      - name: Verify native church messages, shared files and scriptures
        run: node desktop/team.cjs
      - name: Verify installed Windows update
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.windows-package.outcome == 'success' }}
        timeout-minutes: 12
        run: node desktop/installed-update.cjs
